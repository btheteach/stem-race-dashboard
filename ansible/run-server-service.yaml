---
- name: Ensure STEM Race Dashboard service is running
  hosts: all
  become: true
  gather_facts: true

  vars:
    app_name: stem-race-dashboard
    app_user: ubuntu
    app_dir: "/home/{{ app_user }}/stem-race-dashboard"
    repo_url: "https://github.com/btheteach/stem-race-dashboard.git"
    repo_version: "main"
    public_host: "0.0.0.0"
    public_port: 80
    admin_host: "127.0.0.1"
    admin_port: 8081
    node_major: "22"

  tasks:
    - name: Verify Ubuntu Noble host
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version('24.04', '>=')
        fail_msg: "This playbook expects Ubuntu 24.04+ (Noble)."

    - name: Install OS prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - build-essential
        state: present
        update_cache: true

    - name: Ensure NodeSource keyring directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install NodeSource GPG key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /tmp/nodesource-repo.gpg.key
        mode: "0644"

    - name: De-armour NodeSource key
      ansible.builtin.command:
        cmd: gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg /tmp/nodesource-repo.gpg.key
      args:
        creates: /etc/apt/keyrings/nodesource.gpg

    - name: Configure NodeSource apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_{{ node_major }}.x nodistro main"
        filename: nodesource
        state: present

    - name: Install Node.js
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    - name: Check current service state
      ansible.builtin.systemd:
        name: "{{ app_name }}"
      register: service_state
      failed_when: false

    - name: Ensure app parent directory exists
      ansible.builtin.file:
        path: "{{ app_dir | dirname }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Clone or update repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_version }}"
        update: true
      become_user: "{{ app_user }}"

    - name: Check for lockfile
      ansible.builtin.stat:
        path: "{{ app_dir }}/package-lock.json"
      register: npm_lockfile

    - name: Install npm dependencies with npm ci
      ansible.builtin.command:
        cmd: npm ci
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      when: npm_lockfile.stat.exists
      changed_when: false

    - name: Install npm dependencies with npm install
      ansible.builtin.command:
        cmd: npm install
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      when: not npm_lockfile.stat.exists
      changed_when: false

    - name: Build project
      ansible.builtin.command:
        cmd: npm run build
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      changed_when: false

    - name: Write service environment file
      ansible.builtin.copy:
        dest: "/etc/{{ app_name }}.env"
        mode: "0644"
        content: |
          PUBLIC_HOST={{ public_host }}
          PUBLIC_PORT={{ public_port }}
          ADMIN_HOST={{ admin_host }}
          ADMIN_PORT={{ admin_port }}
          NODE_ENV=production

    - name: Install systemd service unit
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ app_name }}.service"
        mode: "0644"
        content: |
          [Unit]
          Description=STEM Race Dashboard
          After=network.target

          [Service]
          Type=simple
          User={{ app_user }}
          WorkingDirectory={{ app_dir }}
          EnvironmentFile=/etc/{{ app_name }}.env
          ExecStart=/usr/bin/node {{ app_dir }}/dist/server/index.js
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd

    - name: Ensure service is enabled and running
      ansible.builtin.systemd:
        name: "{{ app_name }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Show final service status
      ansible.builtin.command: systemctl --no-pager --full status "{{ app_name }}"
      register: final_status
      changed_when: false

    - name: Print service status summary
      ansible.builtin.debug:
        msg: "{{ final_status.stdout_lines[:12] }}"

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
